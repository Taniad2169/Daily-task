<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>WebSwan Site Studio</title>
<style>
:root{--bg:#e9edf0;--panel:#fff;--ink:#16212b;--muted:#566473;--line:#d6dde3;--accent:#0d6e6a;--accent-ink:#fff;--bad:#b42318;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f161c;--panel:#162028;--ink:#e6edf2;--muted:#9aa9b6;--line:#2b3a46;--accent:#3fb8ad;--accent-ink:#06201e;--bad:#ff8a7a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;padding:16px}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px 28px;box-shadow:0 24px 50px -28px rgba(0,0,0,.45)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;margin-bottom:4px}
.logo svg{width:30px;height:30px;color:var(--accent)}
p{margin:0 0 18px;color:var(--muted)}
label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
input[type=password]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
.remember{display:flex;gap:8px;align-items:center;margin:12px 0 18px;font-size:13.5px;color:var(--muted)}
.remember input{accent-color:var(--accent);width:16px;height:16px}
button{width:100%;font:inherit;font-weight:600;padding:11px;border:0;border-radius:9px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.msg{min-height:1.4em;margin:12px 0 0;font-size:13.5px;color:var(--bad)}
</style>
</head>
<body>
<form class="card" id="gate" autocomplete="on">
  <div class="logo"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 22c4 4 14 4 19-2 2-2.5 2-6 0-8-1.6-1.6-4-1.4-5.3.2l-2.2 2.8"/><path d="M17.5 15c-1.5-3-1.3-7 1.5-9 2-1.4 4.6-.6 5.4 1.3"/><path d="M24.4 7.3 27 6.5"/><path d="M4 26h24"/></svg>WebSwan Site Studio</div>
  <p>Private tool. Enter your password to open the builder.</p>
  <input type="text" name="username" value="webswan" autocomplete="username" hidden>
  <label for="pw">Password</label>
  <input type="password" id="pw" autocomplete="current-password" required autofocus>
  <label class="remember"><input type="checkbox" id="remember"> Remember on this computer</label>
  <button type="submit" id="go">Unlock</button>
  <p class="msg" id="msg" role="alert"></p>
</form>
